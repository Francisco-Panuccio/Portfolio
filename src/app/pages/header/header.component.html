<header>
    <span class="nav_span">&lt;FTP/&gt;</span>

    <nav>
        <ul>
            <li><a class="nav_link" routerLink="/home" routerLinkActive="active_link" [routerLinkActiveOptions]="{ exact: true }">{{ messagesService.texts().header.home }}</a></li>
            <li><a class="nav_link" routerLink="/projects" routerLinkActive="active_link">{{ messagesService.texts().header.projects }}</a></li>
            <li><a class="nav_link" routerLink="/about" routerLinkActive="active_link">{{ messagesService.texts().header.about }}</a></li>
            <li><a class="nav_link" routerLink="/contact" routerLinkActive="active_link">{{ messagesService.texts().header.contact }}</a></li>
        </ul>
    </nav>

    <div class="div_btns_header">
        <button class="btn_dark_mode">
            <img src="images/moon.png" [alt]="messagesService.texts().header.lightModeAlt">
        </button>

        <button class="btn_language" (click)="messagesService.toggleLanguage()">
            <img src="images/language.png" [alt]="messagesService.texts().header.languageAlt">
        </button>
    </div>
</header>
